<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparaison des communes</title>
<meta name="description" content="Comparaison des aménagements cyclables des communes suivies, ramenés à la population et à la voirie">
<link rel="stylesheet" href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css">
<script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<link rel="stylesheet" href="../assets/commun.css">
<style>
  /* Même thème sombre que le tableau de bord */
  :root {
    --d-page: #1a1a1a; --d-widget: #242424; --d-entete: #111111; --d-bord: #333333;
    --d-texte: #f0efec; --d-texte-2: #c3c2b7; --d-muet: #898781; --d-grille: #2f2f2d; --d-accent: #3987e5;
  }
  html, body { background: var(--d-page); color: var(--d-texte); }
  body { min-height: 100%; }
  .entete { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: var(--d-entete); border-bottom: 1px solid #000; }
  .entete-titre { flex: 1 1 320px; min-width: 0; }
  .entete-titre h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .entete-titre p { margin: 2px 0 0; font-size: 12.5px; color: var(--d-texte-2); }
  .selecteur { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--d-muet); text-transform: uppercase; letter-spacing: .4px; }
  .selecteur calcite-select { width: 210px; }
  .liens { display: flex; gap: 4px; }

  .avertissement { margin: 8px 8px 0; padding: 8px 14px; background: var(--d-widget); border-radius: 2px; border-left: 3px solid #c98500;
    font-size: 12.5px; color: var(--d-texte-2); display: flex; gap: 8px; align-items: flex-start; }
  .avertissement calcite-icon { color: #c98500; flex: none; margin-top: 1px; }
  .avertissement[hidden] { display: none; }

  .grille { display: grid; gap: 8px; padding: 8px; grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas: "classement evolution" "tableau tableau" "methode methode"; }
  .widget { background: var(--d-widget); border-radius: 2px; display: flex; flex-direction: column; min-width: 0; }
  .w-classement { grid-area: classement; } .w-evolution { grid-area: evolution; } .w-tableau { grid-area: tableau; } .w-methode { grid-area: methode; }
  .w-classement, .w-evolution { height: 360px; }
  .w-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 10px 12px 4px 14px; }
  .w-tete h2 { margin: 0; flex: 1 1 200px; font-size: 14px; font-weight: 600; color: var(--d-texte); }
  .w-tete .w-desc { font-size: 12px; color: var(--d-muet); font-weight: 400; }
  .w-tete calcite-select { width: 290px; max-width: 100%; }
  .w-btn { border: 0; background: none; color: var(--d-muet); width: 28px; height: 28px; border-radius: 2px; cursor: pointer; display: grid; place-items: center; }
  .w-btn:hover, .w-btn[aria-pressed="true"] { background: #333; color: var(--d-texte); }
  .w-corps { flex: 1; min-height: 0; position: relative; padding: 4px 12px 10px; }
  .graph { position: absolute; inset: 4px 12px 10px; }
  .tableau { position: absolute; inset: 4px 12px 10px; overflow: auto; }
  .legende-graph { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--d-texte-2); padding: 0 14px; }
  .legende-graph i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .legende-graph .actif { color: var(--d-texte); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--d-muet); font-weight: 500; border-bottom: 1px solid var(--d-bord); padding: 0; vertical-align: bottom;
    position: sticky; top: 0; background: var(--d-widget); }
  td { padding: 7px 8px; border-bottom: 1px solid #2c2c2a; color: var(--d-texte-2); white-space: nowrap; }
  td.n, th.n { text-align: right; }
  th button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 6px 8px; cursor: pointer; line-height: 1.3; white-space: nowrap; }
  th.n button { text-align: right; }
  th button:hover, th button:focus-visible { color: var(--d-texte); }
  th button:focus-visible { outline: 2px solid var(--d-accent); outline-offset: -2px; }
  th[aria-sort] button { color: var(--d-texte); }
  th[aria-sort="descending"] .fleche::after { content: " ▼"; font-size: 9px; }
  th[aria-sort="ascending"] .fleche::after { content: " ▲"; font-size: 9px; }
  tr.actif td { background: #2b3340; color: var(--d-texte); }
  td a { color: #6da7ec; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .defile-x { overflow-x: auto; }
  .w-tableau .w-corps { padding: 4px 12px 12px; }
  /* Première colonne (commune) figée quand le tableau défile horizontalement */
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--d-widget); z-index: 1; }
  th:first-child { z-index: 2; }
  tr.actif td:first-child { background: #2b3340; }
  .unite { display: block; font-size: 11px; color: var(--d-muet); }
  .visuellement-cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .w-methode .w-corps { font-size: 13px; line-height: 1.55; color: var(--d-texte-2); padding: 2px 14px 12px; }
  .w-methode p { margin: 6px 0; }
  .w-methode b { color: var(--d-texte); }
  .w-methode a { color: #6da7ec; }

  @media (max-width: 900px) {
    .grille { grid-template-columns: 1fr; grid-template-areas: "classement" "evolution" "tableau" "methode"; }
    .w-classement, .w-evolution { height: 330px; }
  }
  @media (max-width: 560px) {
    .entete { position: static; }
    .selecteur, .selecteur calcite-select { width: 100%; }
    .w-tete calcite-select { width: 100%; }
  }
</style>
</head>
<body class="calcite-mode-dark">
<header class="entete">
  <div class="entete-titre">
    <h1>Comparaison des communes</h1>
    <p id="sous-titre"></p>
  </div>
  <label class="selecteur">Commune mise en avant<calcite-select id="s-commune" scale="s" label="Commune mise en avant"></calcite-select></label>
  <div class="liens">
    <calcite-action id="vers-tdb" icon="dashboard" text="Tableau de bord" text-enabled scale="s"></calcite-action>
    <calcite-action id="vers-portail" icon="apps" text="Portail" text-enabled scale="s"></calcite-action>
  </div>
</header>
<div class="avertissement" id="avertissement" hidden><calcite-icon icon="information" scale="s"></calcite-icon><span></span></div>

<main class="grille">
  <section class="widget w-classement" aria-label="Classement des communes">
    <header class="w-tete"><h2>Classement <span class="w-desc" id="classement-desc"></span></h2>
      <calcite-select id="s-indic" scale="s" label="Indicateur du classement"></calcite-select></header>
    <div class="w-corps"><div class="graph"><canvas id="g-classement" role="img" aria-label="Classement des communes"></canvas></div></div>
  </section>

  <section class="widget w-evolution" aria-label="Évolution du réseau cyclable">
    <header class="w-tete"><h2>Évolution du réseau <span class="w-desc" id="evolution-desc"></span></h2>
      <calcite-segmented-control id="m-evol" scale="s" label="Unité">
        <calcite-segmented-control-item value="hab" checked>Pour 10 000 hab.</calcite-segmented-control-item>
        <calcite-segmented-control-item value="km">En km</calcite-segmented-control-item>
      </calcite-segmented-control>
      <button class="w-btn" id="bascule-evol" title="Afficher les données" aria-pressed="false"><calcite-icon icon="table" scale="s"></calcite-icon></button></header>
    <div class="legende-graph" id="legende-evol"></div>
    <div class="w-corps"><div class="graph"><canvas id="g-evolution" role="img" aria-label="Évolution du réseau cyclable par commune"></canvas></div><div class="tableau" hidden></div></div>
  </section>

  <section class="widget w-tableau" aria-label="Tous les indicateurs">
    <header class="w-tete"><h2>Tous les indicateurs <span class="w-desc">(cliquer un en-tête pour trier)</span></h2>
      <calcite-button id="telecharger" appearance="transparent" kind="neutral" icon-start="download" scale="s" download>Télécharger (JSON)</calcite-button></header>
    <div class="w-corps"><div class="defile-x"><table id="t-comparaison"><caption class="visuellement-cache">Indicateurs cyclables par commune</caption></table></div></div>
  </section>

  <section class="widget w-methode" aria-label="Méthode">
    <header class="w-tete"><h2>Méthode et limites</h2></header>
    <div class="w-corps" id="methode"></div>
  </section>
</main>

<script src="../data/communes.js"></script>
<script src="../data/comparaison.js"></script>
<script>window.MV_SANS_DONNEES = true;</script>
<script src="../assets/commun.js"></script>
<script>
(function () {
  const CMP = window.MV_COMPARAISON;
  if (!CMP || !CMP.communes.length) {
    document.querySelector("main").innerHTML = '<p style="padding:24px;color:#c3c2b7">Aucune commune publiée : lancez la chaîne ' +
      '(<code>05_mise_a_jour/maj_annuelle.bat</code>) pour générer <code>data/comparaison.js</code>.</p>';
    return;
  }
  const COMMUNES = CMP.communes;
  const LISTE = window.MV_COMMUNES || { defaut: COMMUNES[0].dossier };

  // ---------- Outils ----------
  const nf = {}, num = (v, d) => (v == null || !isFinite(v) ? "n.d." : (nf[d] ||= new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d })).format(v));
  const dateFr = (s) => new Date(s + "T00:00:00").toLocaleDateString("fr-FR");
  const echapper = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ratio = (v, pop, base) => (v == null || !pop ? null : (v / pop) * base);
  // Lien vers une page d'une commune, sans paramètre pour la commune par défaut
  const lienCommune = (url, dossier) => (dossier === LISTE.defaut ? url : `${url}?commune=${encodeURIComponent(dossier)}`);

  // Croissance du réseau depuis 2020 : allongement entre le 31/12/2019 et la date des données, ramené à l'année
  function croissance(c) {
    const base = c.par_annee.find((p) => p.annee === 2019);
    if (!base) return null;
    const fin = new Date(c.date_donnees_osm + "T00:00:00"), debutAnnee = new Date(c.annee_partielle, 0, 1);
    const duree = (c.annee_partielle - 2020) + (fin - debutAnnee) / (365 * 864e5);
    return duree > 0 ? (c.totaux.km_total - base.km_cumule) / duree : null;
  }

  // Indicateurs : un seul calcul, partagé par le classement et le tableau
  const INDIC = [
    { id: "km_hab", titre: "Réseau pour 10 000 habitants", unite: "km", court: "km pour 10 000 hab.", dec: 1,
      f: (c) => ratio(c.totaux.km_total, c.population, 1e4) },
    { id: "densite", titre: "Densité (km pour 100 km de voirie)", unite: "km pour 100 km de voirie", court: "km pour 100 km de voirie", dec: 1,
      f: (c) => c.totaux.km_pour_100km_voirie },
    { id: "site_propre", titre: "Part en site propre", unite: "%", court: "% en site propre", dec: 0,
      f: (c) => 100 * c.totaux.part_site_propre },
    { id: "croissance_hab", titre: "Croissance depuis 2020 pour 10 000 hab.", unite: "km par an", court: "km par an pour 10 000 hab.", dec: 2,
      f: (c) => ratio(croissance(c), c.population, 1e4) },
    { id: "places_hab", titre: "Stationnement pour 1 000 habitants", unite: "places", court: "places pour 1 000 hab.", dec: 1,
      f: (c) => ratio(c.totaux.places_declarees, c.population, 1e3) },
    { id: "km", titre: "Réseau cyclable total", unite: "km", court: "km", dec: 1, f: (c) => c.totaux.km_total },
  ];

  // Couleurs des communes : palette catégorielle validée (daltonisme, fond sombre), ordre fixe = ordre de la liste
  const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9"];
  const couleur = (i) => (i < PALETTE.length ? PALETTE[i] : "#8a8a8a");

  // ---------- État : commune mise en avant (?commune=), indicateur, unité ----------
  const U = new URLSearchParams(location.search);
  const connue = (d) => COMMUNES.some((c) => c.dossier === d);
  const etat = {
    commune: connue(U.get("commune")) ? U.get("commune") : connue(LISTE.defaut) ? LISTE.defaut : COMMUNES[0].dossier,
    indic: INDIC.some((x) => x.id === U.get("indicateur")) ? U.get("indicateur") : "km_hab",
    unite: "hab", tri: { col: 3, sens: -1 },
  };

  // ---------- En-tête ----------
  const dates = [...new Set(COMMUNES.map((c) => c.date_donnees_osm))];
  document.getElementById("sous-titre").textContent = `${COMMUNES.length} commune${COMMUNES.length > 1 ? "s" : ""} · aménagements recensés dans OpenStreetMap · ` +
    (dates.length === 1 ? `données au ${dateFr(dates[0])}` : "données à des dates différentes");
  const avert = [];
  if (COMMUNES.length === 1) avert.push("Une seule commune est publiée pour l'instant : la comparaison s'enrichira avec les suivantes.");
  if (dates.length > 1) avert.push("Les données OpenStreetMap n'ont pas été extraites à la même date pour toutes les communes : " +
    COMMUNES.map((c) => `${echapper(c.nom)} au ${dateFr(c.date_donnees_osm)}`).join(", ") + ". Les rythmes annuels en tiennent compte.");
  if (avert.length) { const a = document.getElementById("avertissement"); a.querySelector("span").innerHTML = avert.join(" "); a.hidden = false; }

  const sCommune = document.getElementById("s-commune");
  sCommune.innerHTML = COMMUNES.map((c) => `<calcite-option value="${echapper(c.dossier)}" ${c.dossier === etat.commune ? "selected" : ""}>${echapper(c.nom)}</calcite-option>`).join("");
  sCommune.addEventListener("calciteSelectChange", () => { etat.commune = sCommune.value; majUrl(); toutRendre(); });
  const sIndic = document.getElementById("s-indic");
  sIndic.innerHTML = INDIC.map((x) => `<calcite-option value="${x.id}" ${x.id === etat.indic ? "selected" : ""}>${echapper(x.titre)}</calcite-option>`).join("");
  sIndic.addEventListener("calciteSelectChange", () => { etat.indic = sIndic.value; majUrl(); majClassement(); });
  document.getElementById("m-evol").addEventListener("calciteSegmentedControlChange", (e) => { etat.unite = e.target.value; majEvolution(); });
  document.getElementById("vers-portail").addEventListener("click", () => { location.href = lienCommune("../index.html", etat.commune); });
  document.getElementById("vers-tdb").addEventListener("click", () => { location.href = lienCommune("../tableau-de-bord/index.html", etat.commune); });
  document.getElementById("telecharger").href = "../../03_publication/services/comparaison.json";
  function majUrl() {
    const p = new URLSearchParams();
    if (etat.commune !== LISTE.defaut) p.set("commune", etat.commune);
    if (etat.indic !== "km_hab") p.set("indicateur", etat.indic);
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
  }

  // ---------- Graphiques ----------
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 12;
  Chart.defaults.color = "#c3c2b7";
  Chart.defaults.borderColor = "#2f2f2d";
  Chart.defaults.animation.duration = 350;
  Object.assign(Chart.defaults.plugins.tooltip, { backgroundColor: "#111", borderColor: "#444", borderWidth: 1, padding: 10,
    titleColor: "#f0efec", bodyColor: "#c3c2b7", cornerRadius: 2, boxPadding: 4 });
  Chart.defaults.plugins.legend.display = false;
  const axeV = { grid: { color: "#2f2f2d" }, border: { display: false }, ticks: { color: "#898781" } };
  const axeC = { grid: { display: false }, border: { color: "#383835" }, ticks: { color: "#898781", maxRotation: 0, autoSkipPadding: 6 } };
  // Valeur écrite au bout de chaque barre
  const valeurs = {
    id: "valeurs",
    afterDatasetsDraw(chart, _a, o) {
      if (!o || !o.format) return;
      const { ctx } = chart; ctx.save(); ctx.textBaseline = "middle";
      chart.getDatasetMeta(0).data.forEach((bar, i) => {
        ctx.font = `${o.actif(i) ? 600 : 400} 12px ${Chart.defaults.font.family}`;
        ctx.fillStyle = o.actif(i) ? "#f0efec" : "#c3c2b7";
        ctx.fillText(o.format(i), bar.x + 6, bar.y);
      });
      ctx.restore();
    },
  };
  // Nom de la commune au bout de chaque courbe (4 communes au plus), décalé pour éviter les chevauchements
  const finCourbes = {
    id: "finCourbes",
    afterDatasetsDraw(chart) {
      if (chart.data.datasets.length > 4) return;
      const { ctx } = chart, pts = [];
      chart.data.datasets.forEach((ds, i) => {
        let j = ds.data.length - 1; while (j >= 0 && ds.data[j] == null) j--;
        if (j < 0) return;
        const p = chart.getDatasetMeta(i).data[j];
        pts.push({ x: p.x, y: p.y, t: ds.label, actif: ds.actif });
      });
      pts.sort((a, b) => a.y - b.y);
      for (let k = 1; k < pts.length; k++) if (pts[k].y - pts[k - 1].y < 15) pts[k].y = pts[k - 1].y + 15;
      ctx.save(); ctx.textBaseline = "middle";
      pts.forEach((p) => { ctx.font = `${p.actif ? 600 : 400} 12px ${Chart.defaults.font.family}`; ctx.fillStyle = p.actif ? "#f0efec" : "#c3c2b7"; ctx.fillText(p.t, p.x + 8, p.y); });
      ctx.restore();
    },
  };

  // Classement : une barre par commune, triée ; la commune mise en avant en bleu, les autres en gris-bleu
  const gClassement = new Chart(document.getElementById("g-classement"), {
    type: "bar", plugins: [valeurs],
    data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderRadius: 4, borderSkipped: "start", maxBarThickness: 26, barPercentage: 0.7 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, layout: { padding: { right: 64 } },
      scales: { x: { ...axeV, beginAtZero: true }, y: { ...axeC, ticks: { color: "#c3c2b7", autoSkip: false } } },
      plugins: { tooltip: { callbacks: { label: () => "" } } } },
  });
  function majClassement() {
    const x = INDIC.find((i) => i.id === etat.indic);
    const lignes = COMMUNES.map((c) => ({ c, v: x.f(c) })).filter((l) => l.v != null && isFinite(l.v)).sort((a, b) => b.v - a.v);
    const actif = (i) => lignes[i].c.dossier === etat.commune;
    document.getElementById("classement-desc").textContent = `(${x.court})`;
    gClassement.data.labels = lignes.map((l) => l.c.nom);
    gClassement.data.datasets[0].data = lignes.map((l) => l.v);
    gClassement.data.datasets[0].backgroundColor = lignes.map((_, i) => (actif(i) ? "#3987e5" : "#6b7a8f"));
    gClassement.options.scales.y.ticks.font = (ctx) => ({ weight: actif(ctx.index) ? 600 : 400 });
    gClassement.options.scales.y.ticks.color = (ctx) => (actif(ctx.index) ? "#f0efec" : "#c3c2b7");
    gClassement.options.plugins.valeurs = { format: (i) => num(lignes[i].v, x.dec), actif };
    gClassement.options.plugins.tooltip.callbacks.label = (c) => ` ${num(c.raw, x.dec)} ${x.court}`;
    gClassement.update();
  }

  // Évolution : réseau au 31/12 de chaque année ; la première valeur est le réseau avant l'année de référence
  const A0 = Math.min(...COMMUNES.map((c) => c.annee_reference)), A1 = Math.max(...COMMUNES.map((c) => c.annee_partielle));
  const ANNEES = Array.from({ length: A1 - A0 + 2 }, (_, i) => A0 - 1 + i);
  const serie = (c) => ANNEES.map((y) => {
    const p = y === c.annee_reference - 1 ? c.par_annee.find((q) => q.annee == null) : c.par_annee.find((q) => q.annee === y);
    return p ? p.km_cumule : null;
  });
  const gEvolution = new Chart(document.getElementById("g-evolution"), {
    type: "line", plugins: [finCourbes],
    data: { labels: ANNEES.map((y) => (y === A1 ? y + "*" : String(y))), datasets: [] },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      layout: { padding: { right: 8 + Math.max(...COMMUNES.map((c) => c.nom.length)) * 7 } },
      scales: { x: axeC, y: { ...axeV, beginAtZero: true } },
      plugins: { tooltip: { itemSort: (a, b) => b.raw - a.raw, callbacks: {
        title: (i) => { const y = ANNEES[i[0].dataIndex]; return y === A1 ? `Réseau à la date des données (${A1})` : `Réseau au 31/12/${y}`; } } } } },
  });
  function majEvolution() {
    const hab = etat.unite === "hab", dec = hab ? 1 : 1, unite = hab ? "km pour 10 000 hab." : "km";
    document.getElementById("evolution-desc").textContent = hab ? "(km pour 10 000 habitants)" : "(km cumulés)";
    gEvolution.data.datasets = COMMUNES.map((c, i) => {
      const actif = c.dossier === etat.commune;
      return { label: c.nom, actif, data: serie(c).map((v) => (v == null ? null : hab ? ratio(v, c.population, 1e4) : v)),
        borderColor: couleur(i), backgroundColor: couleur(i), borderWidth: actif ? 3 : 2, pointRadius: 0, pointHoverRadius: 4,
        pointHitRadius: 8, tension: 0, order: actif ? 0 : 1 };
    });
    gEvolution.options.scales.y.ticks.callback = (v) => num(v, 0) + (hab ? "" : " km");
    gEvolution.options.plugins.tooltip.callbacks.label = (c) => ` ${c.dataset.label} : ${num(c.raw, dec)} ${unite}`;
    gEvolution.update();
    document.getElementById("legende-evol").innerHTML = COMMUNES.map((c, i) =>
      `<span class="${c.dossier === etat.commune ? "actif" : ""}"><i style="background:${couleur(i)}"></i>${echapper(c.nom)}</span>`).join("") +
      `<span style="color:var(--d-muet)">* ${A1} : jusqu'à la date des données</span>`;
    rendreTableEvolution();
  }
  // Bascule graphique / tableau (accessibilité)
  const bascule = document.getElementById("bascule-evol");
  bascule.addEventListener("click", () => {
    const on = bascule.getAttribute("aria-pressed") !== "true", w = bascule.closest(".widget");
    bascule.setAttribute("aria-pressed", on); bascule.title = on ? "Afficher le graphique" : "Afficher les données";
    w.querySelector(".graph").hidden = on; w.querySelector(".tableau").hidden = !on;
    rendreTableEvolution();
  });
  function rendreTableEvolution() {
    if (bascule.getAttribute("aria-pressed") !== "true") return;
    const hab = etat.unite === "hab";
    const ligne = (y, i) => `<tr><td>${i === 0 ? `Avant ${A0}` : y === A1 ? `${A1} (en cours)` : y}</td>${COMMUNES.map((c) => {
      const v = serie(c)[i]; return `<td class="n">${num(v == null ? null : hab ? ratio(v, c.population, 1e4) : v, 1)}</td>`; }).join("")}</tr>`;
    bascule.closest(".widget").querySelector(".tableau").innerHTML = `<table><thead><tr><th style="padding:6px 8px">Au 31/12</th>${COMMUNES.map((c) =>
      `<th class="n" style="padding:6px 8px">${echapper(c.nom)}</th>`).join("")}</tr></thead><tbody>${ANNEES.map(ligne).join("")}</tbody></table>`;
  }

  // ---------- Tableau de tous les indicateurs, triable ----------
  const COLS = [
    { titre: "Commune", v: (c) => c.nom, html: (c) => `<a href="${lienCommune("../tableau-de-bord/index.html", c.dossier)}">${echapper(c.nom)}</a>` },
    { titre: "Population", v: (c) => c.population, d: 0 },
    { titre: "Réseau", unite: "km", v: (c) => c.totaux.km_total, d: 1 },
    { titre: "Réseau", unite: "km pour 10 000 hab.", v: INDIC[0].f, d: 1 },
    { titre: "Densité", unite: "km pour 100 km de voirie", v: INDIC[1].f, d: 1 },
    { titre: "Site propre", unite: "%", v: INDIC[2].f, d: 0 },
    { titre: "Croissance depuis 2020", unite: "km par an", v: croissance, d: 1 },
    { titre: "Stationnement", unite: "places pour 1 000 hab.", v: INDIC[4].f, d: 1 },
    { titre: "Libre-service", unite: "stations", v: (c) => c.totaux.stations_libre_service, d: 0,
      html: (c) => `${num(c.totaux.stations_libre_service, 0)}${c.reseau_libre_service ? " " + echapper(c.reseau_libre_service) : ""}` },
    { titre: "Données au", v: (c) => c.date_donnees_osm, html: (c) => dateFr(c.date_donnees_osm) },
  ];
  const table = document.getElementById("t-comparaison");
  function rendreTableau() {
    const { col, sens } = etat.tri, k = COLS[col];
    const lignes = [...COMMUNES].sort((a, b) => {
      const x = k.v(a), y = k.v(b);
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "fr") : x - y) * sens;
    });
    table.querySelector("thead")?.remove(); table.querySelector("tbody")?.remove();
    table.insertAdjacentHTML("beforeend", `<thead><tr>${COLS.map((c, i) => `<th scope="col" class="${i && i < COLS.length - 1 ? "n" : ""}"${i === col ? ` aria-sort="${sens < 0 ? "descending" : "ascending"}"` : ""}>
      <button data-col="${i}">${c.titre}<span class="fleche"></span>${c.unite ? `<span class="unite">${c.unite}</span>` : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${lignes.map((c) => `<tr class="${c.dossier === etat.commune ? "actif" : ""}">${COLS.map((k2, i) =>
        `<td class="${i && i < COLS.length - 1 ? "n" : ""}">${k2.html ? k2.html(c) : num(k2.v(c), k2.d)}</td>`).join("")}</tr>`).join("")}</tbody>`);
  }
  table.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-col]"); if (!b) return;
    const col = +b.dataset.col;
    etat.tri = { col, sens: etat.tri.col === col ? -etat.tri.sens : col === 0 ? 1 : -1 };
    rendreTableau();
    table.querySelector(`button[data-col="${col}"]`).focus();
  });

  // ---------- Méthode ----------
  document.getElementById("methode").innerHTML = `
    <p><b>Mêmes règles pour toutes les communes.</b> Chaque commune passe par la même chaîne : aménagements cyclables et stationnement
    recensés dans OpenStreetMap, historique reconstitué avec l'API ohsome, voirie mesurée dans OSM. Les chiffres sont ramenés
    à la population légale (INSEE, via geo.api.gouv.fr) et à la longueur de voirie, pour comparer des villes de tailles différentes.</p>
    <p><b>Définitions.</b> Le site propre regroupe les pistes cyclables et les voies vertes. La croissance depuis 2020 mesure l'allongement
    du réseau entre le 31/12/2019 et la date des données, ramené à une année. L'évolution pour 10 000 habitants utilise la population actuelle.</p>
    <p><b>Limite.</b> OpenStreetMap est une base collaborative : un écart entre deux villes peut aussi refléter un recensement plus ou moins
    complet. Le détail des contrôles de qualité de chaque commune est sur son portail.</p>
    <p><b>Sources.</b> ${echapper(CMP.source)}.</p>
    <p>${MV.credit}</p>`;

  function toutRendre() { majClassement(); majEvolution(); rendreTableau(); }
  toutRendre();
})();
</script>
</body>
</html>
